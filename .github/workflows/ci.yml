name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch/tag.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Cross-platform CLI builds. Each target is built on its native runner.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # .NET 10 — Windows 10 1607+ / Windows 11
          - name: win-x64
            rid: win-x64
            os: windows-latest
            tfm: net10.0
            langversion: ""
          - name: win-x86
            rid: win-x86
            os: windows-latest
            tfm: net10.0
            langversion: ""
          - name: win-arm64
            rid: win-arm64
            os: windows-latest
            tfm: net10.0
            langversion: ""
          # .NET 6 — legacy, Windows 7 SP1 / 8 / 8.1
          - name: win-legacy-x64
            rid: win-x64
            os: windows-latest
            tfm: net6.0
            langversion: latest
          - name: win-legacy-x86
            rid: win-x86
            os: windows-latest
            tfm: net6.0
            langversion: latest
          # Linux / macOS
          - name: linux-x64
            rid: linux-x64
            os: ubuntu-latest
            tfm: net10.0
            langversion: ""
          - name: linux-arm64
            rid: linux-arm64
            os: ubuntu-latest
            tfm: net10.0
            langversion: ""
          - name: osx-x64
            rid: osx-x64
            os: macos-latest
            tfm: net10.0
            langversion: ""
          - name: osx-arm64
            rid: osx-arm64
            os: macos-latest
            tfm: net10.0
            langversion: ""
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install .NET SDK
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            global.json

      - name: Build CLI utilities
        shell: pwsh
        run: |
          $projects = @(
            'src/Applications/UUPDownload/UUPDownload.csproj',
            'src/Applications/UUPMediaConverter/UUPMediaConverter.csproj'
          )
          $publishDir = '${{ github.workspace }}/artifacts/${{ matrix.name }}/CLIs/'
          $common = @(
            '/t:restore;publish',
            '/p:Configuration=Release',
            '/p:RuntimeIdentifier=${{ matrix.rid }}',
            '/p:UUPMediaTargetFramework=${{ matrix.tfm }}',
            '/p:SelfContained=true',
            '/p:PublishSingleFile=true',
            '/p:PublishTrimmed=false',
            "/p:PublishDir=$publishDir"
          )
          # net6.0 needs LangVersion=latest: a few files use language features
          # newer than the C# 10 default of that target framework.
          if ('${{ matrix.langversion }}' -ne '') {
            $common += '/p:LangVersion=${{ matrix.langversion }}'
          }
          foreach ($project in $projects) {
            Write-Host "==> Publishing $project for ${{ matrix.name }}"
            dotnet msbuild $project @common
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Split symbols
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}/artifacts/${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path "$root/PDBs" | Out-Null
          Get-ChildItem "$root/CLIs/*.pdb" -ErrorAction SilentlyContinue |
            Move-Item -Destination "$root/PDBs/"

      - name: Upload binaries
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.name }}-binaries
          path: ${{ github.workspace }}/artifacts/${{ matrix.name }}/CLIs
          if-no-files-found: error
          retention-days: 7

      - name: Upload symbols
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.name }}-symbols
          path: ${{ github.workspace }}/artifacts/${{ matrix.name }}/PDBs
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The Windows-only helper tools target the Windows-specific TFM
  # (net10.0-windows10.0.22621), which none of the CLI builds above exercise.
  # Playground and Windows.Internal.Flighting are intentionally left out: they
  # need the Windows 10 SDK UAP platform (10.0.22621.0), which GitHub-hosted
  # runners do not provide (CsWinRT fails with "Could not read the Windows
  # SDK's Platform.xml").
  # ---------------------------------------------------------------------------
  windows-tools:
    name: Windows-only tools
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install .NET SDK
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            global.json

      - name: Build UUPSort
        run: dotnet build src/Applications/UUPSort/UUPSort.csproj --configuration Release --nologo

  # ---------------------------------------------------------------------------
  # On a version tag, assemble the archives from the build artifacts and
  # publish (or update) the GitHub release.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts

      - name: Assemble archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          main_variants=(win-x64 win-x86 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64)
          legacy_variants=(win-legacy-x64 win-legacy-x86)

          main_stage="$(mktemp -d)"
          legacy_stage="$(mktemp -d)"
          mkdir -p "${main_stage}/bin" "${legacy_stage}/bin"

          for v in "${main_variants[@]}"; do
            mkdir -p "${main_stage}/bin/${v}"
            cp -a "artifacts/${v}-binaries/." "${main_stage}/bin/${v}/"
          done
          for v in "${legacy_variants[@]}"; do
            mkdir -p "${legacy_stage}/bin/${v}"
            cp -a "artifacts/${v}-binaries/." "${legacy_stage}/bin/${v}/"
          done

          for stage in "${main_stage}" "${legacy_stage}"; do
            cp README.md README.es.md "${stage}/"
            mkdir -p "${stage}/docs"
            cp docs/*.md "${stage}/docs/"
          done

          mkdir -p dist
          ( cd "${main_stage}"   && zip -r -q -X "${GITHUB_WORKSPACE}/dist/UUPMediaCreator-lin-v${version}.zip" . )
          ( cd "${legacy_stage}" && zip -r -q -X "${GITHUB_WORKSPACE}/dist/UUPMediaCreator-lin-v${version}-legacy.zip" . )
          ( cd dist && sha256sum ./*.zip > checksums.txt )
          ls -la dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi
